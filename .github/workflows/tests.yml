name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.6
        run: |
          curl --fail --location --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.6-stable_linux.x86_64"
      - name: Run regression tests
        shell: pwsh
        run: ./tests/run_tests.ps1 -Godot "$env:RUNNER_TEMP/godot/Godot_v4.6-stable_linux.x86_64"
